name: Create and Publish Islamic History Episode

on:
  schedule:
    # الـ workflow بيتشغّل الساعة 08:00 UTC (11ص القاهرة، UTC+3) —
    # ده معاد بدء التوليد بس، مش معاد النشر الفعلي؛ النشر نفسه مجدول
    # (dueAt عند Buffer، publishAt عند يوتيوب) على مواعيد منفصلة تحت.
    #
    # حسب دراسات نشر عامة (Buffer/Hopper HQ 2026 — لا توجد بيانات خاصة
    # بجمهور عربي تحديدًا، راجع تحليلات قناتك بعد فترة لتدقيق المواعيد):
    # الفيديو الطويل أداؤه أفضل مساءً (7-10م، وقت فراغ فعلي)، والشورتس
    # أداؤها أفضل صبحًا/ضهرًا (ذروة أساسية 11ص-12ظ، ثانوية ~4ع) أثناء
    # تصفّح سريع. فالجدولة الفعلية (FULL_VIDEO_DELAY_HOURS /
    # FULL_TO_SHORT_*_HOURS في خطوة النشر تحت) بتخلي:
    #   • الفيديو الكامل ينشر نفس اليوم الساعة ~7م (تأخير 8 ساعات)
    #   • short_1 ينشر اليوم التالي صباحًا ~11ص (تأخير 24 ساعة)
    #   • short_2 ينشر اليوم التالي عصرًا ~4ع (تأخير 29 ساعة)
    # وبالتالي الشورتس بتوصل بعد ما الفيديو الكامل يكون منشورًا بالفعل،
    # فتفضل تأدي دورها كتشويق له.
    - cron: "0 8 * * *"
  workflow_dispatch:

# يمنع تشغيل حلقتين في الوقت نفسه، ولا يلغي التشغيل الجاري.
concurrency:
  group: islamic-history-episode-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
